name: Label Issue as In Progress on Branch Creation

on:
  create:

jobs:
  label-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Label issue on new branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (context.payload.ref_type !== 'branch') {
              console.log("Not a branch creation — skipping.");
              return;
            }

            const ref = context.ref;
            const match = ref.match(/issue(\d+)/);

            if (!match) {
              console.log("No issue number found in branch name.");
              return;
            }

            const issueNumber = parseInt(match[1], 10);
            console.log(`Detected issue number: #${issueNumber}`);

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const existingLabels = issue.labels.map(label => label.name.toLowerCase());

            if (!existingLabels.includes('in progress')) {
              console.log(`Adding label 'In Progress' to issue #${issueNumber}`);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ['In Progress']
              });
            } else {
              console.log(`Issue #${issueNumber} already has label 'In Progress'`);
            }
