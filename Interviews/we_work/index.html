<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Stack Engineer Mock Exam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Full Stack Engineer Mock Exam</h1>
        <div id="quiz">
            <div id="question-container">
                <div id="category" class="category" style="font-weight:600; color:#007bff; margin-bottom:8px;"></div>
                <h2 id="question">Question text</h2>
                <div id="options" class="options-container">
                    <!-- Options will be loaded here by JavaScript -->
                </div>
            </div>
            <button id="submit-btn">Submit Answer</button>
            <button id="next-btn" style="display:none;">Next Question</button>
            <div id="feedback" class="feedback"></div>
            <div id="explanation" class="explanation" style="margin-top:12px; color:#333; font-size:0.95em;"></div>
            <div id="results" class="results" style="display:none;">
                <h2>Your Score: <span id="score">0</span>/<span id="total-questions">0</span></h2>
                <button id="restart-btn">Restart Exam</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
